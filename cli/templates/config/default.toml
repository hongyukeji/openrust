[app]
name = "{{name}}"
url = "http://localhost:3000"

[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
shutdown_timeout_secs = 10
trusted_proxy_ranges = []

[server.compression]
enabled = true

[server.cors]
enabled = false

[api]
http_status = "always_ok"

[i18n]
default_locale = "en"
fallback_locale = "en"

[mail]
driver = "log"

[sms]
driver = "log"

[session]
secure = true
http_only = true
same_site = "lax"
ttl_secs = 1209600
