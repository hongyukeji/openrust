[package]
name = "session-custom-driver-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
openrust = { path = "../../..", version = "0.0.0", default-features = false, features = ["session"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
sea-orm = { path = "../../../vendor/sea-orm" }
sqlx-mysql = { path = "../../../vendor/sqlx-mysql" }
