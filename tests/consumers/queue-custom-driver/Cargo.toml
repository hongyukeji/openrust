[package]
name = "custom-queue-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
openrust = { path = "../../..", version = "0.0.0", features = ["queue"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }

[patch.crates-io]
sqlx-mysql = { path = "../../../vendor/sqlx-mysql" }
