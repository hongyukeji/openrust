[package]
name = "custom-sqlite-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
openrust = { path = "../../..", version = "0.0.0", default-features = false, features = ["cache-redis"] }
figment = "0.10.19"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
sqlx-mysql = { path = "../../../vendor/sqlx-mysql" }
