[package]
name = "test-app-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
session = ["openrust/auth"]

[dependencies]
openrust = { path = "../../..", version = "0.0.0", default-features = false }
figment = { version = "0.10", features = ["toml"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
sqlx-mysql = { path = "../../../vendor/sqlx-mysql" }
