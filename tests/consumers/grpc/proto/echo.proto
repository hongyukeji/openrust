syntax = "proto3";

package openrust.example.v1;

message EchoRequest {
  string value = 1;
  string client_hint = 2;
}

message EchoResponse {
  string value = 1;
  string api_revision = 2;
}

service Echo {
  rpc Unary(EchoRequest) returns (EchoResponse);
  rpc ServerStream(EchoRequest) returns (stream EchoResponse);
  rpc ClientStream(stream EchoRequest) returns (EchoResponse);
  rpc Bidirectional(stream EchoRequest) returns (stream EchoResponse);
}
