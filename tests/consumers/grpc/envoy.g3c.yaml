static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 50070
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_ingress
                codec_type: AUTO
                http2_protocol_options:
                  max_concurrent_streams: 100
                route_config:
                  name: grpc_routes
                  virtual_hosts:
                    - name: grpc_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: openrust_grpc
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%CONNECTION_ID% %PROTOCOL% %REQ(X-G3C-RUN)% %REQ(:PATH)% %RESPONSE_CODE% %UPSTREAM_HOST%\n"
  clusters:
    - name: openrust_grpc
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 1s
          no_traffic_interval: 0.5s
          no_traffic_healthy_interval: 0.5s
          unhealthy_threshold: 1
          healthy_threshold: 1
          grpc_health_check:
            service_name: openrust.example.v1.Echo
      load_assignment:
        cluster_name: openrust_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: g3c-node-a
                      port_value: 50061
              - endpoint:
                  address:
                    socket_address:
                      address: g3c-node-b
                      port_value: 50062
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
