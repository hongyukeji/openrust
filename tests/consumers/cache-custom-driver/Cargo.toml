[package]
name = "custom-cache-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
figment = { version = "0.10", features = ["toml"] }
openrust = { path = "../../..", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
