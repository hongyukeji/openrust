[package]
name = "realtime-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
openrust = { path = "../../..", version = "0.0.0", features = ["realtime-redis"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "net", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
futures-util = "0.3"
bytes = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[[bin]]
name = "realtime-node"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
