[package]
name = "custom-communication-drivers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
figment = { version = "0.10", features = ["toml"] }
openrust = { path = "../../..", version = "0.0.0" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }

[patch.crates-io]
sqlx-mysql = { path = "../../../vendor/sqlx-mysql" }
