name: Rust naming
on: [push, pull_request]
permissions:
  contents: read
jobs:
  naming:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/tmp/rust-naming-ci/cargo-target
      TMPDIR: ${{ github.workspace }}/target/tmp/rust-naming-ci/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Prepare temporary directories
        run: mkdir -p "$TMPDIR"
      - name: Check naming policy and compiler consumers
        run: python3 tests/rust_naming.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
