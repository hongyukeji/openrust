name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p server --features queue-redis --test queue_redis
        env:
          REDIS_URL: redis://127.0.0.1:6379/
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: build on MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo run --locked --manifest-path examples/db-custom-sqlite/Cargo.toml
      - run: cargo run --locked --manifest-path examples/queue-custom-driver/Cargo.toml

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  databases:
    name: PostgreSQL and MySQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openrust
          POSTGRES_PASSWORD: openrust
          POSTGRES_DB: openrust_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U openrust" --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: openrust
          MYSQL_PASSWORD: openrust
          MYSQL_DATABASE: openrust_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p openrust --features db-postgres
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p testing --features db-postgres --test database
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p server --features auth,db-postgres
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p server --features 'auth-mfa auth-oidc db-postgres' --test auth_mfa --test auth_oidc
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p server --features queue,db-postgres --test db_migration --test queue --test queue_crash_recovery --test schedule --test schedule_calendar --test queue_notifications
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p openrust --features db-mysql
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://openrust:openrust@localhost:3306/openrust_test
      - run: cargo test -p testing --features db-mysql --test database
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: cargo test -p server --features auth,db-mysql
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://openrust:openrust@localhost:3306/openrust_test
      - run: cargo test -p server --features 'auth-mfa auth-oidc db-mysql' --test auth_mfa --test auth_oidc
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: cargo test -p server --features queue,db-mysql --test db_migration --test queue --test queue_crash_recovery --test schedule --test schedule_calendar --test queue_notifications
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
