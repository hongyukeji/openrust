name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      database_scope:
        description: 数据库子矩阵；不替代完整发布验收
        type: choice
        options: [routine-mysql, release-backends]
        default: routine-mysql

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  OPENRUST_TEST_DATABASE_STATE_DIR: ${{ github.workspace }}/storage/framework/testing/databases
  OPENRUST_TEST_ARTIFACT_DIR: ${{ github.workspace }}/tmp/test-artifacts

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 .agents/project/scripts/test-workspace.py --database-scope routine-mysql
      - run: python3 .agents/project/scripts/test-workspace.py --database-scope release-backends
        if: github.event_name == 'workflow_dispatch' && inputs.database_scope == 'release-backends'
      - run: cargo run --locked --manifest-path tests/consumers/grpc/Cargo.toml --bin grpc-example
      - run: cargo test -p openrust-framework --features queue-redis --test queue_redis
        env:
          REDIS_URL: redis://127.0.0.1:6379/
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: build on MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo check --locked --manifest-path tests/consumers/db-custom-sqlite/Cargo.toml
      - run: cargo run --locked --manifest-path tests/consumers/db-custom-sqlite/Cargo.toml
        if: github.event_name == 'workflow_dispatch' && inputs.database_scope == 'release-backends'
      - run: cargo run --locked --manifest-path tests/consumers/queue-custom-driver/Cargo.toml
      - run: cargo check --locked --manifest-path tests/consumers/grpc/Cargo.toml

  grpc-cluster:
    name: gRPC HTTP/2 routing, drain, and reconnect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path tests/consumers/grpc/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path tests/consumers/grpc/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path tests/consumers/grpc/Cargo.toml --all-features
      - run: tests/consumers/grpc/scripts/test-g3c.sh

  realtime-cluster:
    name: WebSocket and SSE cross-node routing
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path tests/consumers/realtime/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path tests/consumers/realtime/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path tests/consumers/realtime/Cargo.toml --test cluster -- --nocapture
        env:
          OPENRUST_REALTIME_TEST_REDIS_URL: redis://127.0.0.1:6379/

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  databases:
    name: MySQL daily integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: openrust
          MYSQL_PASSWORD: openrust
          MYSQL_DATABASE: openrust_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features db-mysql
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: cargo test -p testing --features db-mysql --test database
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: cargo test --workspace --features auth,db-mysql
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: |
          cargo test -p openrust --features 'auth-fortify auth-oidc db-mysql' --test auth_oidc
          cargo test -p openrust --features 'auth-fortify auth-oidc db-mysql' --bin app bootstrap::fortify_flows::mysql_ -- --ignored
          cargo test -p openrust --features 'auth-fortify auth-oidc db-mysql' --bin app mysql_root_jwt_api_without_session_or_cookie_provider -- --ignored
          cargo test -p openrust-framework --features 'auth-fortify auth-oidc db-mysql' --lib auth::factor_gate::real_server_tests -- --ignored
          if ! cargo test -p openrust-framework --features 'auth-fortify queue db-mysql' --lib auth::fortify::api_management::tests::event_tests::queued::mysql_global_listener_rejection_rolls_back_queued_enrollment -- --ignored --exact > "$RUNNER_TEMP/fortify-event-test.log" 2>&1; then
            cat "$RUNNER_TEMP/fortify-event-test.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/fortify-event-test.log"
          rg -q '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/fortify-event-test.log"
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test
      - run: cargo test -p openrust-framework --features queue,db-mysql --test db_migration --test queue --test queue_crash_recovery --test schedule --test schedule_calendar --test queue_notifications
        env:
          OPENRUST_TEST_DATABASE_URL: mysql://root:root@localhost:3306/openrust_test

  postgres-release:
    # 发布数据库子矩阵；日常实际数据库验收仅MySQL。
    name: PostgreSQL release integration subset
    if: github.event_name == 'workflow_dispatch' && inputs.database_scope == 'release-backends'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openrust
          POSTGRES_PASSWORD: openrust
          POSTGRES_DB: openrust_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U openrust" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features db-postgres
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p testing --features db-postgres --test database
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test --workspace --features auth,db-postgres
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: |
          cargo test -p openrust --features 'auth-fortify auth-oidc db-postgres' --test auth_oidc
          cargo test -p openrust --features 'auth-fortify auth-oidc db-postgres' --bin app bootstrap::fortify_flows::postgres_ -- --ignored
          cargo test -p openrust --features 'auth-fortify auth-oidc db-postgres' --bin app postgres_root_jwt_api_without_session_or_cookie_provider -- --ignored
          cargo test -p openrust-framework --features 'auth-fortify auth-oidc db-postgres' --lib auth::factor_gate::real_server_tests -- --ignored
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
      - run: cargo test -p openrust-framework --features queue,db-postgres --test db_migration --test queue --test queue_crash_recovery --test schedule --test schedule_calendar --test queue_notifications
        env:
          OPENRUST_TEST_DATABASE_URL: postgres://openrust:openrust@localhost:5432/openrust_test
