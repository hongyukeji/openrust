name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci
      - name: Build the documentation
        run: npm --prefix docs run build
      - name: Install Chromium for the documentation checks
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" playwright@1.65.0
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify all three languages at both deployment paths
        run: |
          DOCS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/docs-browser/node_modules/playwright" \
            node docs/tests/check_browser.mjs
