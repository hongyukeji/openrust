services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openrust
      POSTGRES_PASSWORD: openrust
      POSTGRES_DB: openrust_test
    ports:
      - "${OPENRUST_TEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrust -d openrust_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: openrust
      MYSQL_PASSWORD: openrust
      MYSQL_DATABASE: openrust_test
    ports:
      - "${OPENRUST_TEST_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
