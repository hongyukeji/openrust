x-openrust-image: &openrust-image ${OPENRUST_IMAGE:-${COMPOSE_PROJECT_NAME:-openrust}-app:local}

x-storage-mount: &storage-mount
  type: bind
  source: ${OPENRUST_DATA_DIR:-./docker-data}/storage
  target: /app/storage
  bind:
    create_host_path: true

x-mysql-mount: &mysql-mount
  type: bind
  source: ${OPENRUST_DATA_DIR:-./docker-data}/mysql
  target: /var/lib/mysql
  bind:
    create_host_path: true

x-redis-mount: &redis-mount
  type: bind
  source: ${OPENRUST_DATA_DIR:-./docker-data}/redis
  target: /data
  bind:
    create_host_path: true

# 只允许修改空目录的挂载根。已迁移数据和自选权限由部署者保留。
x-data-init: &data-init
  user: "0:0"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
  security_opt: [no-new-privileges:true]
  entrypoint:
    - /bin/sh
    - -ec
    - |
      directory="$$1"
      owner="$$2"
      check_access() {
        if [ "$$owner" = mysql:mysql ]; then
          gosu "$$owner" "$$@"
        else
          setpriv --reuid="$${owner%:*}" --regid="$${owner#*:}" --clear-groups "$$@"
        fi
      }
      writable() {
        check_access /bin/sh -ec 'test -w "$$1" && test -x "$$1"' check-data "$$directory"
      }
      if writable; then
        exit 0
      fi
      contents="$$(find "$$directory" -mindepth 1 -maxdepth 1 -print -quit)"
      if [ -z "$$contents" ] && [ "$$(stat -c %u:%g "$$directory")" = 0:0 ]; then
        chown --no-dereference "$$owner" "$$directory"
        if writable; then
          exit 0
        fi
      fi
      printf '数据目录 %s 对账号 %s 不可写，请在宿主机检查挂载目录权限。\n' "$$directory" "$$owner" >&2
      exit 1
    - prepare-data

x-openrust: &openrust
  image: *openrust-image
  user: "10001:10001"
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:${SERVER_PORT:-3000}}
    APP_NAME:
    APP_KEY:
    APP_PREVIOUS_KEYS:
    AUTH_PROFILE:
    APP_AUTH_JWT_KEYS_LOCAL:
    APP_SECURITY_ENCRYPTION_KEYS_LOCAL:
    APP_SECURITY_SIGNED_LINKS_KEYS_LOCAL:
    APP_REALTIME_ALLOWED_ORIGINS:
    APP_SERVER_HOST: 0.0.0.0
    SERVER_PORT: "3000"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-openrust}
    DB_USERNAME: ${DB_USERNAME:-openrust}
    DB_PASSWORD: ${DB_PASSWORD:-openrust}
    CACHE_STORE: ${CACHE_STORE:-redis}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: ${REDIS_DB:-0}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    QUEUE_REDIS_NAMESPACE:
services:
  app:
    <<: *openrust
    build:
      context: .
      args:
        APP_FEATURES: ${OPENRUST_BUILD_FEATURES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - *storage-mount
      - type: bind
        source: ${OPENRUST_PUBLIC_DIR:-./public}
        target: /app/public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${OPENRUST_HTTP_BIND:-127.0.0.1}:${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 45s

  migrate:
    <<: *openrust
    pull_policy: never
    entrypoint: ["/app/artisan"]
    command: [migrate]
    volumes:
      - *storage-mount
    depends_on:
      storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  storage-init:
    <<: *data-init
    image: *openrust-image
    pull_policy: never
    command: [/app/storage, "10001:10001"]
    volumes:
      - *storage-mount

  mysql-init:
    <<: *data-init
    image: mysql:8.4
    command: [/var/lib/mysql, "mysql:mysql"]
    volumes:
      - *mysql-mount

  mysql:
    image: mysql:8.4
    user: "mysql:mysql"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:-openrust}
      MYSQL_USER: ${DB_USERNAME:-openrust}
      MYSQL_PASSWORD: ${DB_PASSWORD:-openrust}
    volumes:
      - *mysql-mount
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  redis-init:
    <<: *data-init
    image: redis:8
    command: [/data, "redis:redis"]
    volumes:
      - *redis-mount

  redis:
    image: redis:8
    user: "redis:redis"
    depends_on:
      redis-init:
        condition: service_completed_successfully
    volumes:
      - *redis-mount
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
