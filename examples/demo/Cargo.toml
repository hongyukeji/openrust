[[test]]
name = "data_exchange_tasks"
path = "tests/server/data_exchange_tasks.rs"
required-features = ["data-exchange-tasks"]

[[test]]
name = "grpc"
path = "tests/server/grpc.rs"
required-features = ["grpc"]

[[test]]
name = "realtime"
path = "tests/server/realtime.rs"
required-features = ["realtime"]

[[test]]
name = "db_connection"
path = "tests/server/database/connection.rs"

[[test]]
name = "db_coordination"
path = "tests/server/database/coordination.rs"

[[test]]
name = "db_migration"
path = "tests/server/database/migration.rs"

[[test]]
name = "http_client"
path = "tests/server/http/client.rs"

[[test]]
name = "i18n"
path = "tests/server/i18n/runtime.rs"

[[test]]
name = "mail_templates"
path = "tests/server/mail/templates.rs"
required-features = ["mail-templates"]

[[test]]
name = "queue"
path = "tests/server/queue/worker.rs"

[[test]]
name = "queue_notifications"
path = "tests/server/queue/notifications.rs"
required-features = ["queue"]

[[test]]
name = "queue_redis"
path = "tests/server/queue/redis.rs"
