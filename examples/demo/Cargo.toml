[package]
name = "demo"
publish = false
description = "OpenRust 聚合应用与真实服务回归。"
readme = "README.md"
autobins = false
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
openrust.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
serde_json.workspace = true
tower-sessions = { workspace = true, features = ["memory-store"] }
tokio-stream.workspace = true

axum.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true
validator.workspace = true
redis.workspace = true
reqwest.workspace = true
tempfile.workspace = true
rcgen.workspace = true
[[test]]
name = "auth"
path = "tests/server/auth/routes.rs"

[[test]]
name = "auth_database"
path = "tests/server/auth/database.rs"

[[test]]
name = "auth_runtime"
path = "tests/server/auth/runtime.rs"

[[test]]
name = "auth_query_authorization"
path = "tests/server/auth/query_authorization.rs"
required-features = ["auth"]

[[test]]
name = "auth_oidc"
path = "tests/server/auth/oidc.rs"
required-features = ["auth-oidc"]

[[test]]
name = "auth_oidc_keycloak"
path = "tests/server/auth/oidc_keycloak.rs"
required-features = ["auth-oidc"]

[[test]]
name = "auth_mfa"
