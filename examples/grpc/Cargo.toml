[package]
name = "grpc-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[features]
db-postgres = ["openrust/db-postgres", "testing/db-postgres"]
db-mysql = ["openrust/db-mysql", "testing/db-mysql"]

[dependencies]
openrust = { path = "../..", version = "0.0.0", features = ["grpc", "auth"] }
prost = "0.14"
tonic = { version = "~0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "~0.14.6"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = "0.3"
figment = "0.10"

[build-dependencies]
tonic-prost-build = "~0.14.6"
protoc-bin-vendored = "~3.3.0"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27"
time = "0.3"
testing = { path = "../../tools/testing", version = "0.0.0" }
