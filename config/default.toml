[app]
name = "openrust"
url = "http://localhost:3000"

[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
max_concurrent_requests = 1024
shutdown_timeout_secs = 10
metrics_endpoint_enabled = false

[server.compression]
enabled = true

[server.cors]
enabled = false
# 如需启用 CORS，请设置 enabled = true 并列出精确来源：
# allowed_origins = ["https://example.com"]
# allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
# allowed_headers = ["content-type", "authorization", "x-request-id"]
# expose_headers = ["x-request-id"]
# allow_credentials = false
# max_age_secs = 600

[api]
http_status = "always_ok"

[i18n]
default_locale = "en"
fallback_locale = "en"

[mail]
driver = "log"

[sms]
driver = "log"

[cache]
default_store = "default"

[cache.stores.default]
driver = "redis"
namespace = "server"
dsn = "redis://127.0.0.1:6379/"

[cache.singleflight]
max_in_flight_keys = 128
max_waiters_per_key = 64
loader_timeout_secs = 30

[cache.swr]
max_in_flight_refreshes = 64

[session]
secure = true
http_only = true
same_site = "lax"
ttl_secs = 1209600

# 可选的独立数据库实例不会继承 [database] 配置：
# [database.instances.analytics]
# url = "postgres://user:password@host/database"
# max_connections = 4
# table_prefix = "analytics_"
