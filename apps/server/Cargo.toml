[package]
name = "server"
description = "OpenRust 框架集成测试宿主"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
autotests = false

[dependencies]
openrust.workspace = true

[dev-dependencies]
axum.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
figment.workspace = true
futures-util.workspace = true
testing.workspace = true
serde_json.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-sessions = { workspace = true, features = ["memory-store"] }
validator.workspace = true
redis.workspace = true
reqwest.workspace = true

[lints]
workspace = true

[[bench]]
name = "db_routing"
harness = false
required-features = ["db-routing-bench"]

[features]
default = []
db-postgres = ["openrust/db-postgres", "testing/db-postgres"]
db-mysql = ["openrust/db-mysql", "testing/db-mysql"]
auth = ["openrust/auth"]
mail-smtp = ["openrust/mail-smtp"]
mail-templates = ["openrust/mail-templates"]
sms-twilio = ["openrust/sms-twilio"]
encryption = ["openrust/encryption"]
queue = ["openrust/queue"]
queue-redis = ["openrust/queue-redis"]
db-routing-bench = []
http-client = ["openrust/http-client"]
cache-redis = ["openrust/cache-redis"]
session-redis = ["auth", "openrust/session-redis"]
storage-local = ["openrust/storage-local"]
storage-s3 = ["storage-local", "openrust/storage-s3"]

[[test]]
name = "auth"
path = "tests/auth/routes.rs"

[[test]]
name = "auth_database"
path = "tests/auth/database.rs"

[[test]]
name = "auth_runtime"
path = "tests/auth/runtime.rs"

[[test]]
name = "auth_query_authorization"
path = "tests/auth/query_authorization.rs"
required-features = ["auth"]

[[test]]
name = "db_connection"
path = "tests/database/connection.rs"

[[test]]
name = "db_coordination"
path = "tests/database/coordination.rs"

[[test]]
name = "db_migration"
path = "tests/database/migration.rs"

[[test]]
name = "http_client"
path = "tests/http/client.rs"

[[test]]
name = "i18n"
path = "tests/i18n/runtime.rs"

[[test]]
name = "mail_templates"
path = "tests/mail/templates.rs"
required-features = ["mail-templates"]

[[test]]
name = "queue"
path = "tests/queue/worker.rs"

[[test]]
name = "queue_notifications"
path = "tests/queue/notifications.rs"
required-features = ["queue"]

[[test]]
name = "queue_redis"
path = "tests/queue/redis.rs"
required-features = ["queue-redis"]

[[test]]
name = "queue_crash_recovery"
path = "tests/queue/crash_recovery.rs"

[[test]]
name = "schedule"
path = "tests/schedule/coordination.rs"

[[test]]
name = "schedule_calendar"
path = "tests/schedule/calendar.rs"

[[test]]
name = "server"
path = "tests/server/aggregate.rs"

[[test]]
name = "storage_http"
path = "tests/storage/http.rs"
required-features = ["storage-local"]

[[test]]
name = "storage_s3"
path = "tests/storage/s3.rs"
required-features = ["storage-s3"]

[[test]]
name = "storage_driver_contract"
path = "tests/storage/driver_contract.rs"
