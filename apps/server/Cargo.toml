[package]
name = "openrust-server"
description = "OpenRust framework integration host"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
openrust.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
figment.workspace = true
openrust-test.workspace = true
serde_json.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-sessions = { workspace = true, features = ["memory-store"] }
validator.workspace = true

[lints]
workspace = true

[[bench]]
name = "db_routing"
harness = false
required-features = ["db-routing-bench"]

[features]
default = []
db-postgres = ["openrust/db-postgres", "openrust-test/db-postgres"]
db-mysql = ["openrust/db-mysql", "openrust-test/db-mysql"]
auth = ["openrust/auth"]
mail-smtp = ["openrust/mail-smtp"]
db-routing-bench = []
http-client = ["openrust/http-client"]
