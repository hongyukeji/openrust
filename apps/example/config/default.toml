[app]
name = "example"
url = "http://localhost:3000"

[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
max_concurrent_requests = 1024
shutdown_timeout_secs = 10
metrics_endpoint_enabled = false
trusted_proxy_ranges = []

[server.compression]
enabled = true

[server.cors]
enabled = false

[api]
http_status = "always_ok"

[i18n]
default_locale = "en"
fallback_locale = "en"

[mail]
driver = "log"

[sms]
driver = "log"

[cache]
default_store = "default"

[cache.stores.default]
driver = "redis"
namespace = "example"
dsn = "redis://127.0.0.1:6379/"

[cache.singleflight]
max_in_flight_keys = 128
max_waiters_per_key = 64
loader_timeout_secs = 30

[cache.swr]
max_in_flight_refreshes = 64

[session]
secure = true
http_only = true
same_site = "lax"
ttl_secs = 1209600

# 可选的独立数据库实例不会继承 [database] 配置：
# [database.instances.analytics]
# url = "postgres://user:password@host/database"
# max_connections = 4
# table_prefix = "analytics_"

[auth.jwt]
issuer = "http://localhost:3000"
audience = "example"
active_key_id = "local"
keys = {}

[security.signed_links]
issuer = "http://localhost:3000"
active_key_id = "local"
keys = {}

[security.encryption]
active_key_id = "local"
keys = {}

[grpc]
listen_addr = "127.0.0.1:50051"
