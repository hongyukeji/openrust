[package]
name = "openrust-translate"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
fastrand = "2.4.1"
google-cloud-auth = { version = "=1.19.0", default-features = false, features = ["default-rustls-provider"] }
hex = "0.4"
http = "1.5"
md-5 = "0.11"
openrust = { package = "openrust-framework", path = "../openrust-framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["sync", "time"] }
url = "2.5.8"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
