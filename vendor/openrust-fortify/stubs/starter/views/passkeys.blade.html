<script type="module">
import { Passkeys } from '{{ route('user.passkeys.script') }}';
const form = document.querySelector('#passkey-register');
form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    const status = document.querySelector('#passkey-status');
    button.disabled = true;
    try {
        Passkeys.configure({fetch: {headers: {'X-CSRF-TOKEN': form.elements._token.value}}});
        await Passkeys.register({name: form.elements.name.value, routes: {options: form.dataset.options, submit: form.dataset.submit}});
        window.location.reload();
    } catch (error) {
        if (error.status === 423) window.location.assign('{{ route('password.confirm') }}');
        status.textContent = error.name === 'UserCancelledError' ? '{{ __('user.passkey_cancelled') }}' : '{{ __('user.passkey_failed') }}';
    } finally { button.disabled = false; }
});
</script>
