[package]
edition = "2021"
rust-version = "1.85"
name = "imgalifier-avif"
version = "0.1.0"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust AVIF decoder: reuses the HEIF container and pipeline, adds an AV1 still-picture backend (vendored rav1d)"
readme = "README.md"
keywords = [
    "heic",
    "heif",
    "avif",
    "image",
    "decoder",
]
categories = [
    "multimedia::images",
    "multimedia::encoding",
]
license = "MIT AND BSD-2-Clause"
repository = "https://github.com/qarmin/imgalifier"
resolver = "3"

[features]
bitdepth_16 = []
bitdepth_8 = []
default = [
    "bitdepth_8",
    "bitdepth_16",
]
image = ["imgalifier-heif/image"]

[lib]
name = "imgalifier_avif"
path = "src/lib.rs"

[[example]]
name = "compare_avif"
path = "examples/compare_avif.rs"

[[example]]
name = "to_png_avif"
path = "examples/to_png_avif.rs"

[[test]]
name = "image_hooks"
path = "tests/image_hooks.rs"

[[test]]
name = "regressions"
path = "tests/regressions.rs"

[dependencies.atomig]
version = "0.4.0"
features = ["derive"]

[dependencies.bitflags]
version = "2.4.0"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.imgalifier-heif]
version = "0.1.0"
default-features = false

[dependencies.parking_lot]
version = "0.12.2"

[dependencies.pastey]
version = "0.1.1"

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.strum]
version = "0.27"
features = ["derive"]

[dependencies.to_method]
version = "1.1.0"

[dependencies.zerocopy]
version = "0.7.32"
features = ["derive"]

[dev-dependencies.image]
version = "0.25"
features = ["bmp"]
default-features = false

[dev-dependencies.png]
version = "0.18"

