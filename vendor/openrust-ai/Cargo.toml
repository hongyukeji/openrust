[package]
name = "openrust-ai"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../openrust-framework" }
async-openai = { version = "=0.43.0", default-features = false, features = ["chat-completion-types", "embedding-types", "response-types"] }
async-stream = "0.3.6"
aws-config = { version = "=1.13.4", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-bedrock = { version = "=1.171.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrockruntime = { version = "=1.151.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "=1.129.0", default-features = false }
aws-smithy-runtime-api = "=1.22.1"
aws-smithy-types = "=1.9.5"
bytes = "1.12.1"
cap-std = "4.0.3"
eventsource-stream = "=0.2.3"
futures-util = { version = "0.3", default-features = false }
http = "1.4"
md-5 = { version = "=0.11.0", default-features = false }
rmcp = { version = "=3.12.0", default-features = false, features = ["client"] }
saphyr = { version = "=0.4.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
