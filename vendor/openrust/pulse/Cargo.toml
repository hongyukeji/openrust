[package]
name = "openrust-pulse"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[features]
telescope = ["dep:openrust-telescope"]

[dependencies]
openrust-telescope = { path = "../telescope", optional = true }
http = "1.4"
openrust = { package = "openrust-framework", path = "../framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
backtrace = "=0.3.76"
indexmap = { version = "=2.14.2", features = ["serde"] }
md5 = "0.8.0"
pcre2 = "=0.2.11"
fastrand = "2.3"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk"] }
jiff = "=0.2.46"
clap = "4.6.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.27"

[[example]]
name = "pulse-acceptance"
path = "tests/fixtures/application.rs"

[lints]
workspace = true
