[package]
name = "openrust-webhook-client"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
standardwebhooks = "=1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
http = "1.4"
zeroize = "1.9"
thiserror = "2"
base64 = "0.22"
clap = "4.6.1"
tokio = { version = "1.54.1", features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tempfile = "3"

[lints]
workspace = true
