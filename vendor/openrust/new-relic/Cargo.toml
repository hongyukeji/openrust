[package]
name = "openrust-new-relic"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry-http = { version = "=0.33.1", default-features = false, features = ["reqwest-blocking"] }
async-trait = "0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
url = "2.5"
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
