[package]
name = "openrust-passkeys"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
openrust = { package = "openrust-framework", path = "../framework" }
webauthn-rs-core = "=0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor_2 = "=0.13.0"
url = "2.5"
base64 = "=0.22.1"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
thiserror = "2"

[dev-dependencies]
http = "1.4"
chrono = "0.4"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }

[[test]]
name = "ceremony_driver"
path = "tests/ceremony_driver.rs"
harness = false
