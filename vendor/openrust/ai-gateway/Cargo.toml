[package]
name = "openrust-ai-gateway"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
openrust-ai = { path = "../ai" }
async-stream = "0.3.6"
eventsource-stream = "=0.2.3"
futures-util = { version = "0.3", default-features = false }
http = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
