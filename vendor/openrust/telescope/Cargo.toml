[package]
name = "openrust-telescope"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "=0.2.46"
uuid = { version = "=1.29.2", default-features = false, features = ["std", "v7", "serde"] }
hostname = "=0.4.2"
md5 = "=0.8.1"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
clap = "4.6.1"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false }
futures-util = "0.3"
http = "1.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3.27"

[[example]]
name = "telescope-acceptance"
path = "tests/fixtures/application.rs"

[lints]
workspace = true
