<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="__CSRF__"><title>Telescope · Application diagnostics</title>
<style nonce="__NONCE__">
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#dce5ed;background:#10151c;color-scheme:dark;font-size:14px}*{box-sizing:border-box}body{margin:0}header{height:78px;border-bottom:1px solid #2b3441;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#151c25}h1{font-size:22px;letter-spacing:-.5px;margin:0}header p{color:#97a6b7;font-size:12px;margin:4px 0 0}.badge{padding:5px 10px;border:1px solid #354452;border-radius:20px;font-size:12px;color:#73d9c5}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 78px)}nav{padding:20px 12px;border-right:1px solid #2b3441;background:#131a23}nav button{width:100%;text-align:left;border:0;background:transparent;padding:9px 14px;color:#a8b7c6;border-radius:6px;margin-bottom:3px}nav button[aria-current=true]{color:#86e5d1;background:#223b3c}main{padding:26px;min-width:0}.toolbar,.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{justify-content:space-between}.toolbar h2{font-size:21px;margin:0}.tools{display:flex;gap:8px}.filters{margin:22px 0 16px}button,input{font:inherit;border:1px solid #394554;background:#1c2632;color:#e4edf5;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:hover{background:#2a3847}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #71d8c2;outline-offset:3px}input{background:#141c26;min-width:150px}.filters input{flex:1}.muted{color:#91a2b4}.danger{color:#f3a5a5}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#91a2b4;background:#19222e}th,td{border-bottom:1px solid #2b3441;padding:13px 12px;vertical-align:top}td.summary{max-width:600px;overflow-wrap:anywhere}td button{border:0;color:#80deca;background:transparent;padding:0;font-family:ui-monospace,monospace}#notice{min-height:22px;margin:15px 0;color:#a9b9c8}#notice.error{color:#f5a1a1}.table-wrap{overflow-x:auto;border:1px solid #2b3441;border-radius:8px}#detail{margin-top:28px}#detail pre{background:#0d1219;border:1px solid #2b3441;border-radius:8px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;font:12px/1.7 ui-monospace,monospace}.detail-head{display:flex;align-items:center;justify-content:space-between}#tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tag{border-radius:16px;font-size:12px;padding:5px 10px}.foot{display:flex;justify-content:space-between;align-items:center;padding-top:16px;font-size:12px}.empty{padding:46px;text-align:center;color:#91a2b4}#monitoring{margin-top:24px;border-top:1px solid #2b3441;padding-top:20px}h3{font-size:14px;font-weight:600}#monitoring form{display:flex;gap:8px}#monitoring input{min-width:0;flex:1}.hidden{display:none!important}@media(max-width:720px){header{padding:0 16px}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid #2b3441;padding:10px}nav button{width:auto;white-space:nowrap;margin:0}main{padding:18px}#monitoring{margin-top:18px}.tools{flex-wrap:wrap}.filters input{width:100%}th,td{padding:10px 8px}}
.dump-value{font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
#auto-load[aria-pressed=true]{border-color:#71d8c2;color:#86e5d1}
</style>
</head>
<body>
<header><div><h1>Telescope</h1><p>Application diagnostics</p></div><span class="badge" id="status">Connecting</span></header>
<div class="shell"><nav id="navigation" aria-label="Entry types"></nav><main>
<div class="toolbar"><h2 id="title">Requests</h2><div class="tools"><button id="refresh">Refresh</button><button id="auto-load" aria-pressed="false">Auto load entries</button><button id="recording">Toggle recording</button><button id="clear" class="danger">Clear entries</button></div></div>
<form class="filters" id="filters"><input id="tag" aria-label="Filter by tag" placeholder="Tag, or comma-separated tags"><input id="family" aria-label="Filter by family hash" placeholder="Family hash"><button type="submit">Filter</button></form>
<p id="notice" role="status" aria-live="polite"></p>
<p id="dump-warning" class="danger hidden" role="status">Use a shared cache store to capture dumps across processes.</p>
<button id="new-entries" class="hidden">Load new entries</button>
<div class="table-wrap"><table><thead><tr><th>Entry</th><th>Summary</th><th>Recorded</th></tr></thead><tbody id="entries"></tbody></table><div id="empty" class="empty hidden">No entries found.</div></div>
<div class="foot"><span class="muted" id="count"></span><button id="more" disabled>Load more</button></div>
<section id="detail" class="hidden" aria-label="Entry details"><div class="detail-head"><h3>Entry and batch context</h3><button id="close">Close</button></div><div id="tags"></div><button id="resolve" class="hidden">Mark exception resolved</button><pre id="json"></pre></section>
<section id="monitoring"><h3>Monitored tags</h3><div id="monitored"></div><form id="monitor-form"><input id="monitor-tag" placeholder="Tag to monitor" aria-label="Tag to monitor" required><button>Monitor tag</button></form></section>
</main></div>
<script nonce="__NONCE__">
'use strict';
const types=[['requests','Requests'],['exceptions','Exceptions'],['queries','Queries'],['jobs','Jobs'],['batches','Batches'],['logs','Logs'],['cache','Cache'],['client-requests','HTTP client'],['commands','Commands'],['schedule','Schedule'],['events','Events'],['gates','Gates'],['mail','Mail'],['notifications','Notifications'],['models','Models'],['views','Views'],['redis','Redis'],['dumps','Dumps']];
const $=id=>document.getElementById(id),base=__BASE__,csrf=document.querySelector('meta[name="csrf-token"]').content;
function sectionFromLocation(){
    const key=location.pathname.slice(base.length+1).split('/')[0];
    return types.some(([name])=>name===key)?key:'requests';
}
let section=sectionFromLocation(),entries=[],before=null,busy=false,selected=null;
let activeRequest=null,listTimer=null,newEntries=false;
let appliedFilters={tag:null,family_hash:null};
const autoLoadKey='telescopeAutoLoadsNewEntries';
let autoLoad=localStorage.getItem(autoLoadKey)==='1';
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
async function api(path,method='GET',data,signal){
    const response=await fetch(`${base}/telescope-api/${path}`,{method,signal,credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json','X-CSRF-TOKEN':csrf},body:data===undefined?undefined:JSON.stringify(data)});
    if(!response.ok)throw Object.assign(Error(response.status===403?'Access denied. Check your Telescope authorization.':`Request failed (${response.status}).`),{status:response.status});
    const text=await response.text();
    return text?JSON.parse(text):null;
}
function summary(entry){const c=entry.content||{};switch(entry.type){case'request':case'client_request':return`${c.method||''} ${c.uri||''} → ${c.response_status||'N/A'}`;case'exception':return`${c.class||''}: ${c.message||''}`;case'query':return c.sql||'';case'log':return`[${c.level||''}] ${c.message||''}`;case'job':return`${c.name||''} [${c.status||''}]`;case'cache':return`${c.type||''} ${c.key||''}`;case'command':return c.command||'';default:return c.name||c.subject||c.model||c.command||entry.type}}
function render(){
    const body=$('entries');
    body.replaceChildren();
    for(const entry of entries){
        const row=document.createElement('tr'),id=document.createElement('td'),content=document.createElement('td'),time=document.createElement('td');
        const shortId=entry.id.slice(0,8);
        content.className='summary';
        if(section==='dumps'){
            id.textContent=shortId;
            const value=document.createElement('pre');
            value.className='dump-value';
            value.textContent=entry.content?.dump??'';
            content.append(value);
        }else{
            const button=document.createElement('button');
            button.textContent=shortId;
            button.setAttribute('aria-label',`Open entry ${entry.id}`);
            button.onclick=()=>openEntry(entry.id);
            id.append(button);
            content.textContent=summary(entry);
        }
        time.className='muted';
        time.textContent=entry.created_at;
        row.append(id,content,time);
        body.append(row);
    }
    $('empty').classList.toggle('hidden',entries.length!==0);
    $('count').textContent=`${entries.length} ${entries.length===1?'entry':'entries'}`;
    $('more').disabled=busy||before===null||section==='dumps';
}
function updateStatus(status){
    $('status').textContent=status;
    $('recording').textContent=status==='paused'?'Resume recording':'Pause recording';
    $('dump-warning').classList.toggle('hidden',section!=='dumps'||status!=='wrong-cache');
}
function cancelListUpdate(){
    clearTimeout(listTimer);
    activeRequest?.abort();
    activeRequest=null;
}
function scheduleListPoll(){
    if(!newEntries)listTimer=setTimeout(pollList,section==='dumps'?2000:2500);
}
function filters(append=false){
    return {...appliedFilters,before:append?before:null};
}
function readFilters(){
    const query=new URLSearchParams(location.search);
    appliedFilters={tag:query.get('tag')||null,family_hash:query.get('family_hash')||null};
    $('tag').value=appliedFilters.tag||'';
    $('family').value=appliedFilters.family_hash||'';
}
function applyFilters(){
    appliedFilters={tag:$('tag').value||null,family_hash:$('family').value||null};
    const url=new URL(location.href);
    for(const [key,value] of Object.entries(appliedFilters)){
        if(value)url.searchParams.set(key,value);
        else url.searchParams.delete(key);
    }
    if(url.href!==location.href)history.pushState(null,'',url);
    return load();
}
function visibleEntries(rows){
    if(section==='jobs'||section==='dumps'||appliedFilters.family_hash)return rows;
    const families=new Set();
    return rows.filter(entry=>{
        const family=entry.family_hash;
        if(!family)return true;
        if(families.has(family))return false;
        families.add(family);
        return true;
    });
}
function showNewEntries(available){
    newEntries=available;
    $('new-entries').classList.toggle('hidden',!available);
}
async function pollList(){
    if(activeRequest)return;
    const request=new AbortController();
    activeRequest=request;
    let retry=true;
    try{
        const data=await api(`${section}?take=1`,'POST',filters(),request.signal);
        if(request.signal.aborted)return;
        updateStatus(data.status);
        const latest=data.entries[0]?.id;
        if(latest&&latest!==entries[0]?.id){
            if(section==='dumps'||!entries.length||autoLoad){
                await load();
                return;
            }
            showNewEntries(true);
        }
        notice('');
    }catch(error){
        retry=!error.status;
        if(!request.signal.aborted)notice(error.message,true);
    }finally{
        if(activeRequest===request){
            activeRequest=null;
            if(retry)scheduleListPoll();
        }
    }
}
async function load(append=false){
    cancelListUpdate();
    const request=new AbortController();
    activeRequest=request;
    let retry=true;
    if(!append)showNewEntries(false);
    busy=true;
    $('refresh').disabled=true;
    $('more').disabled=true;
    notice('Loading entries…');
    try{
        const data=await api(section,'POST',{...filters(append),take:50},request.signal);
        if(request.signal.aborted)return;
        const rows=visibleEntries(data.entries);
        entries=append?entries.concat(rows):rows;
        before=data.entries.length===50?data.entries.at(-1).sequence:null;
        updateStatus(data.status);
        notice('');
    }catch(error){
        retry=!error.status;
        if(!request.signal.aborted)notice(error.message,true);
    }finally{
        if(activeRequest===request){
            activeRequest=null;
            busy=false;
            $('refresh').disabled=false;
            render();
            if(retry)scheduleListPoll();
        }
    }
}
async function openEntry(id){if(section==='dumps')return;try{notice('Loading batch…');selected=await api(`${section}/${encodeURIComponent(id)}`);$('json').textContent=JSON.stringify(selected,null,2);$('tags').replaceChildren();for(const tag of selected.entry.tags||[]){const button=document.createElement('button');button.className='tag';button.textContent=tag;button.onclick=()=>{$('tag').value=tag;applyFilters()};$('tags').append(button)}$('resolve').classList.toggle('hidden',section!=='exceptions'||!!selected.entry.content.resolved_at);$('detail').classList.remove('hidden');notice('');$('detail').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){notice(error.message,true)}}
async function tags(){try{const data=await api('monitored-tags');$('monitored').replaceChildren();for(const tag of data.tags){const button=document.createElement('button');button.className='tag';button.textContent=`${tag} ×`;button.setAttribute('aria-label',`Stop monitoring ${tag}`);button.onclick=async()=>{try{await api('monitored-tags/delete','POST',{tag});await tags()}catch(error){notice(error.message,true)}};$('monitored').append(button)}}catch(error){notice(error.message,true)}}
function selectSection(key){
    section=key;
    $('title').textContent=types.find(([name])=>name===key)[1];
    $('detail').classList.add('hidden');
    $('dump-warning').classList.add('hidden');
    for(const button of $('navigation').children){
        button.setAttribute('aria-current',String(button.dataset.section===key));
    }
    entries=[];
    before=null;
    readFilters();
    render();
    return load();
}
for(const [key,label]of types){
    const button=document.createElement('button');
    button.textContent=label;
    button.dataset.section=key;
    button.setAttribute('aria-current',String(key===section));
    button.onclick=()=>{
        if(section!==key)history.pushState(null,'',`${base}/${key}`);
        selectSection(key);
    };
    $('navigation').append(button);
}
$('filters').onsubmit=event=>{event.preventDefault();applyFilters()};
$('refresh').onclick=applyFilters;
$('new-entries').onclick=()=>load();
$('auto-load').setAttribute('aria-pressed',String(autoLoad));
$('auto-load').onclick=()=>{
    autoLoad=!autoLoad;
    localStorage.setItem(autoLoadKey,autoLoad?'1':'0');
    $('auto-load').setAttribute('aria-pressed',String(autoLoad));
};
$('more').onclick=()=>load(true);$('close').onclick=()=>$('detail').classList.add('hidden');$('recording').onclick=async()=>{try{await api('toggle-recording','POST',{});await load()}catch(error){notice(error.message,true)}};$('clear').onclick=async()=>{if(!confirm('Clear all Telescope entries and monitored tags?'))return;try{await api('entries','DELETE');$('detail').classList.add('hidden');await load();await tags()}catch(error){notice(error.message,true)}};$('monitor-form').onsubmit=async event=>{event.preventDefault();try{await api('monitored-tags','POST',{tag:$('monitor-tag').value});$('monitor-tag').value='';await tags()}catch(error){notice(error.message,true)}};$('resolve').onclick=async()=>{try{selected=await api(`exceptions/${selected.entry.id}`,'PUT',{resolved_at:'now'});$('json').textContent=JSON.stringify(selected,null,2);$('resolve').classList.add('hidden')}catch(error){notice(error.message,true)}};addEventListener('pagehide',cancelListUpdate);
addEventListener('pageshow',event=>{if(event.persisted)load()});
addEventListener('popstate',()=>selectSection(sectionFromLocation()));
selectSection(section);tags();
</script>
</body></html>
