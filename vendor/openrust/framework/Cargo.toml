[package]
name = "openrust-framework"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hongyukeji/openrust"
description = "Core framework for OpenRust"
readme = "README.md"
publish = false

[lib]
name = "openrust"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
aws-config = { version = "=1.8.18", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "default-https-client", "http-1x"] }
base64 = "0.22.1"
bcrypt = "0.19.3"
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clap = "4.6.1"
deunicode = "1.6.2"
dotenvy = "0.15.7"
fastrand = "2.4.1"
futures-util = { version = "0.3", default-features = false }
http = "1.0"
http-body = "1.0"
httpdate = "1.0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "multipart", "stream"] }
image = { version = "=0.25.10", default-features = false, features = ["avif", "bmp", "gif", "jpeg", "png", "webp"] }
indexmap = "=2.14.2"
infer = { version = "0.19.0", default-features = false }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "pool", "smtp-transport", "tokio1-rustls-tls"] }
mime_guess = "2.0.5"
multer = "3.1.0"
percent-encoding = "2.3"
quick-xml = { version = "0.42", default-features = false }
pluralizer = "=0.5.0"
regex = "1.12"
redis = { version = "=1.8.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "sqlite-bundled", "tls-rustls-ring", "chrono", "json"] }
sqlx-core = { version = "=0.9.0", default-features = false }
subtle = "2.6.1"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }

tonic = { version = "~0.14.6", default-features = false, features = ["codegen", "router", "server"] }

bigdecimal = "=0.4.11"
chrono-tz = "=0.10.4"
croner = "=4.0.3"
ulid = { version = "=1.2.1", default-features = false }
uuid = { version = "=1.29.2", default-features = false }
webp = { version = "=0.3.1", default-features = false }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }
