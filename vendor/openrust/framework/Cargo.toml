[package]
name = "openrust-framework"
publish = false
description = "OpenRust：Laravel 的 Rust 实现，默认集成优秀第三方扩展，延续熟悉的框架开发体验（重构进行中）。"
readme = "README.md"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
autotests = false

[dependencies]
rusqlite = { workspace = true, optional = true }
pcre2.workspace = true
aes-gcm-siv = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
axum.workspace = true
axum-core.workspace = true
bytes.workspace = true
argon2 = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
shutdown_hooks = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
bigdecimal = "=0.4.11"
chrono.workspace = true
chrono-tz = { workspace = true }
cron-parser = { workspace = true, optional = true }
icu_datetime.workspace = true
icu_decimal.workspace = true
icu_locale.workspace = true
icu_plurals.workspace = true
dotenvy.workspace = true
figment.workspace = true
futures-util.workspace = true
getrandom.workspace = true
uuid = { workspace = true, optional = true }
http.workspace = true
cookie.workspace = true
httpdate = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
indexmap = "2"
jsonwebtoken = { workspace = true, optional = true }
lettre.workspace = true
minijinja = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
aws-sdk-s3 = { version = "=1.152.0", optional = true, default-features = false, features = ["rt-tokio", "default-https-client", "http-1x"] }
macros.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
redis = { workspace = true, optional = true }
hmac.workspace = true
sha1 = { workspace = true, optional = true }
md5_11 = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
sha2.workspace = true
sha2_11.workspace = true
sqlx = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
validator.workspace = true
zeroize.workspace = true
csv = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
tempfile.workspace = true
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
http-body-util.workspace = true
http-body.workspace = true
prost = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std", "process"] }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tokio-tungstenite = "0.29"
serde_json.workspace = true
tokio-stream.workspace = true

axum.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
time.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true
validator.workspace = true
redis.workspace = true
reqwest.workspace = true
tempfile.workspace = true
rcgen.workspace = true
[features]
default = ["db-mysql", "cache-redis", "queue-redis"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "dep:shutdown_hooks"]
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "dep:sqlx", "sqlx/mysql", "dep:shutdown_hooks"]
db-sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "dep:sqlx", "sqlx/sqlite", "dep:rusqlite", "dep:winapi-util", "dep:shutdown_hooks"]
db-uuid = ["dep:uuid", "sea-orm/with-uuid", "sea-orm-migration/with-uuid"]
session = ["dep:time"]
auth = [
    "hashing",
    "session",
    "dep:jsonwebtoken",
    "dep:time",
    "signing",
]
hashing = ["dep:argon2", "dep:bcrypt"]
queue = ["dep:cron-parser"]
queue-redis = ["queue", "dep:redis"]
signing = ["dep:jsonwebtoken"]
mail-smtp = ["lettre/smtp-transport", "lettre/tokio1-rustls-tls"]
mail-templates = ["dep:minijinja"]
view = ["dep:minijinja", "minijinja/loader"]
http-client = ["dep:reqwest", "dep:ipnet", "dep:httpdate"]
auth-oidc = ["auth", "http-client", "encryption", "dep:oauth2"]
auth-fortify = ["auth", "encryption", "dep:sha1", "dep:md5_11", "dep:qrcode"]
sms-twilio = ["http-client"]
encryption = ["dep:aes-gcm-siv", "dep:aws-lc-rs"]
test-util = []
data-exchange = ["dep:csv", "dep:calamine", "dep:rust_xlsxwriter", "dep:zip", "dep:quick-xml"]
data-exchange-tasks = ["data-exchange", "queue", "dep:uuid"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream", "dep:tonic-health", "dep:tonic-reflection", "dep:rustls"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
realtime = ["auth", "axum/ws", "dep:uuid"]
realtime-redis = ["realtime", "dep:redis"]
cache-redis = ["dep:redis"]
session-redis = ["session", "dep:redis"]
storage-local = ["dep:opendal", "dep:uuid"]
storage-s3 = [
    "dep:aws-sdk-s3",
    "storage-local",
    "opendal/services-s3",
    "opendal/http-transport-reqwest",
    "opendal/executors-tokio",
]

[lints]
workspace = true

