[package]
name = "openrust-framework"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hongyukeji/openrust"
description = "Core framework for OpenRust"
readme = "README.md"
publish = false

[lib]
name = "openrust"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = "4.6.1"
dotenvy = "0.15.7"
fastrand = "2.4.1"
http = "1.0"
httpdate = "1.0.3"
indexmap = "=2.14.2"
mime_guess = "2.0.5"
percent-encoding = "2.3"
quick-xml = { version = "0.42", default-features = false }
regex = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
