[package]
name = "openrust-localization-database"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tempfile = "3.27"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

[lints]
workspace = true
