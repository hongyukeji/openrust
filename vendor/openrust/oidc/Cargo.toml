[package]
name = "openrust-oidc"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
zeroize = "1.9.0"
url = "2.5"
http = "1.4"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
base64 = "0.22"
subtle = "2.6"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "time"] }

[lints]
workspace = true
