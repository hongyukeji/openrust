[package]
name = "openrust-horizon"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "=1.29.2", features = ["std", "v7"] }
jiff = "=0.2.46"
clap = "4.6.1"
http = "1.4"
memory-stats = { version = "1.2.0", features = ["always_use_statm"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3.27"

[[example]]
name = "horizon-acceptance"
path = "tests/fixtures/application.rs"

[lints]
workspace = true
