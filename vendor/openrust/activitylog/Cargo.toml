[package]
name = "openrust-activitylog"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "sync"] }
openrust = { package = "openrust-framework", path = "../framework" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "=0.2.46"
clap = "4.6.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tempfile = "3.27"
http = "1.4"
