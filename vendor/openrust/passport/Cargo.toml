[package]
name = "openrust-passport"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
rsa = "0.9.10"
rand = "0.8"
base64 = "0.22"
clap = "4.6.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
zeroize = "1.8"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net"] }
reqwest = { version = "0.13.5", default-features = false }
