[package]
name = "openrust-reverb"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
md-5 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["sync", "net", "time", "macros", "rt"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
fastrand = "2"
clap = "4.6.1"
url = "2.5.8"

openrust = { package = "openrust-framework", path = "../framework" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }

futures-util = "0.3"
redis = { version = "=1.8.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
