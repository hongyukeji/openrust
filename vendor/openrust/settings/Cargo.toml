[package]
name = "openrust-settings"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
jiff = { version = "=0.2.46", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["sync"] }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tempfile = "3.27"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

[[test]]
name = "settings_process"
path = "tests/process.rs"
harness = false
