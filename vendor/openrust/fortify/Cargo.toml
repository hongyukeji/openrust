[package]
name = "openrust-fortify"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
md-5 = { version = "=0.11.0", default-features = false }
serde_json = "1.0"
zeroize = "1.9.0"
subtle = "2.6"
thiserror = "2"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
