[package]
name = "openrust-fortify"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[features]
sanctum = ["openrust/sanctum"]
socialite = ["dep:openrust-socialite", "sanctum"]

[dependencies]
base64 = "=0.22.1"
openrust-socialite = { path = "../socialite", optional = true }
url = "2.5.8"
jiff = { version = "=0.2.46", features = ["serde"] }
openrust-passkeys = { path = "../passkeys" }
clap = "4.6.1"
openrust = { package = "openrust-framework", path = "../framework" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
md-5 = { version = "=0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9.0"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.54.1", features = ["time"] }

qrcode = { version = "=0.14.1", default-features = false }

[dev-dependencies]
serde_cbor_2 = "=0.13.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }

[lints]
workspace = true
