[package]
name = "openrust-ai"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
async-openai = { version = "=0.43.0", default-features = false, features = ["chat-completion-types", "response-types"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
