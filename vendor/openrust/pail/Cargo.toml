[package]
name = "openrust-pail"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
openrust = { package = "openrust-framework", path = "../framework" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0"

[dev-dependencies]
clap = "4.6.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
fastrand = "2"
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }

[[test]]
name = "capture"
path = "tests/capture.rs"
harness = false
