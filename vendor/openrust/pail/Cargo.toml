[package]
name = "openrust-pail"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
clap = "4.6.1"
fastrand = "2"
same-file = "1.0.6"
tokio = { version = "1.54.1", features = ["time", "rt", "macros"] }
tokio-util = "0.7"
console = "0.16.6"
regex = "1.12"
openrust = { package = "openrust-framework", path = "../framework" }
jiff = { version = "=0.2.46", features = ["serde"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
sha2 = "0.10.9"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }

[[test]]
name = "capture"
path = "tests/capture.rs"
harness = false

[[test]]
name = "provider"
path = "tests/provider.rs"
harness = false

[[test]]
name = "printer"
path = "tests/printer.rs"
harness = false

[[test]]
name = "command"
path = "tests/command.rs"
harness = false

[lints]
workspace = true
