[package]
name = "openrust-passport"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.openrust.discovery]
version = 1
providers = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }

openrust = { package = "openrust-framework", path = "../openrust-framework" }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "non-fips"] }
rsa = { version = "=0.10.0", features = ["hazmat"] }
rand10 = { package = "rand", version = "0.10.1" }
rand = "0.8"
base64 = "0.22"
clap = "4.6.1"
console = "0.16.6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
zeroize = "1.8"

pcre2 = "0.2"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
url = "2.5"
jiff = { version = "=0.2.46", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "net"] }
reqwest = { version = "0.13.5", default-features = false }

[lints]
workspace = true
