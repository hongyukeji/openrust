[package]
name = "openrust"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hongyukeji/openrust"
description = "OpenRust — Rust Web 应用框架"
readme = "README.md"
publish = false

[workspace]
members = ["vendor/openrust/*"]
exclude = ["vendor/pcre2", "vendor/sqlx-mysql", "vendor/crypto-glue", "vendor/sqlx-sqlite", "vendor/rav1e", "vendor/imgalifier-avif", "vendor/aws-smithy-http", "vendor/aws-smithy-runtime", "vendor/aws-smithy-types"]
default-members = ["."]
resolver = "3"

#region framework-version
[workspace.package]
version = "0.0.0"
#endregion framework-version

[workspace.lints.rust]
linker_messages = "allow"
non_snake_case = "deny"
non_camel_case_types = "deny"
non_upper_case_globals = "deny"

[lints]
workspace = true

[patch.crates-io]
pcre2 = { path = "vendor/pcre2" }
rav1e = { path = "vendor/rav1e" }
imgalifier-avif = { path = "vendor/imgalifier-avif" }
aws-smithy-http = { path = "vendor/aws-smithy-http" }
aws-smithy-runtime = { path = "vendor/aws-smithy-runtime" }
aws-smithy-types = { path = "vendor/aws-smithy-types" }
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
crypto-glue = { path = "vendor/crypto-glue" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }

[[bin]]
name = "main"
path = "main.rs"
doc = false

[features]
standalone = []
sanctum = ["openrust/sanctum", "openrust-fortify?/sanctum"]
reverb = ["dep:openrust-reverb"]
pail = ["dep:openrust-pail"]
passport = ["dep:openrust-passport"]
fortify = ["dep:openrust-fortify"]
socialite = ["dep:openrust-socialite"]
oidc = ["dep:openrust-oidc"]
settings = ["dep:openrust-settings"]
pay = ["dep:openrust-pay"]
new-relic = ["dep:openrust-new-relic"]
webhook-client = ["dep:openrust-webhook-client"]
webhook-server = ["dep:openrust-webhook-server"]
cashier = ["dep:openrust-cashier"]
activitylog = ["dep:openrust-activitylog"]
horizon = ["dep:openrust-horizon"]
pennant = ["dep:openrust-pennant"]
pulse = ["dep:openrust-pulse"]
scout = ["dep:openrust-scout"]
telescope = ["dep:openrust-telescope", "openrust-pulse?/telescope"]

[dependencies]
jiff = { version = "=0.2.46", features = ["serde"] }
clap = "4.6.1"
openrust = { package = "openrust-framework", path = "vendor/openrust/framework" }
openrust-reverb = { path = "vendor/openrust/reverb", optional = true }
openrust-pail = { path = "vendor/openrust/pail", optional = true }
openrust-passport = { path = "vendor/openrust/passport", optional = true }
openrust-fortify = { path = "vendor/openrust/fortify", optional = true }
openrust-socialite = { path = "vendor/openrust/socialite", optional = true }
openrust-oidc = { path = "vendor/openrust/oidc", optional = true }
openrust-settings = { path = "vendor/openrust/settings", optional = true }
openrust-pay = { path = "vendor/openrust/pay", optional = true }
openrust-new-relic = { path = "vendor/openrust/new-relic", optional = true }
openrust-webhook-client = { path = "vendor/openrust/webhook-client", optional = true }
openrust-webhook-server = { path = "vendor/openrust/webhook-server", optional = true }
openrust-cashier = { path = "vendor/openrust/cashier", optional = true }
openrust-activitylog = { path = "vendor/openrust/activitylog", optional = true }
openrust-horizon = { path = "vendor/openrust/horizon", optional = true }
openrust-pennant = { path = "vendor/openrust/pennant", optional = true }
openrust-pulse = { path = "vendor/openrust/pulse", optional = true }
openrust-scout = { path = "vendor/openrust/scout", optional = true }
openrust-telescope = { path = "vendor/openrust/telescope", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[build-dependencies]
openrust-package-discovery = { path = "vendor/openrust/package-discovery" }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["net"] }
tonic = { version = "~0.14.6", default-features = false, features = ["channel"] }
tonic-health = "0.14.9"

[[test]]
name = "container_process"
path = "tests/container_process.rs"
harness = false

[[test]]
name = "queue_hard_timeout"
path = "tests/queue_hard_timeout.rs"
harness = false

[[test]]
name = "sms_worker_app"
path = "tests/support/sms/worker_app.rs"
harness = false

[[test]]
name = "driver_extensions_app"
path = "tests/support/driver_extensions/app.rs"
harness = false

[[test]]
name = "new_relic_app"
path = "tests/support/new_relic/app.rs"
harness = false
required-features = ["new-relic"]

[[test]]
name = "webhooks_app"
path = "tests/support/webhooks/app.rs"
harness = false
required-features = ["webhook-client", "webhook-server"]
