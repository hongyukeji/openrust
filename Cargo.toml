[features]
default = []
db-postgres = ["openrust/db-postgres"]
db-mysql = ["openrust/db-mysql"]
db-uuid = ["openrust/db-uuid"]
auth = ["openrust/auth"]
queue = ["openrust/queue"]
queue-redis = ["openrust/queue-redis"]
signing = ["openrust/signing"]
mail-smtp = ["openrust/mail-smtp"]
mail-templates = ["openrust/mail-templates"]
view = ["openrust/view"]
http-client = ["openrust/http-client"]
auth-oidc = ["openrust/auth-oidc"]
auth-mfa = ["openrust/auth-mfa"]
sms-twilio = ["openrust/sms-twilio"]
encryption = ["openrust/encryption"]
test-util = ["openrust/test-util"]
data-exchange = ["openrust/data-exchange"]
data-exchange-tasks = ["openrust/data-exchange-tasks"]
grpc = ["openrust/grpc"]
metrics = ["openrust/metrics"]
otel = ["openrust/otel"]
realtime = ["openrust/realtime"]
realtime-redis = ["openrust/realtime-redis"]
cache-redis = ["openrust/cache-redis"]
session-redis = ["openrust/session-redis"]
storage-local = ["openrust/storage-local"]
storage-s3 = ["openrust/storage-s3"]

[lints]
workspace = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# 依赖以 O2 编译一次后缓存，显著缩短开发期增量构建。
opt-level = 2
