[package]
name = "openrust"
publish = false
description = "OpenRust：Laravel 的 Rust 实现，默认集成优秀第三方扩展，延续熟悉的框架开发体验（重构进行中）。"
readme = "README.md"
autobins = false
default-run = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
autotests = false

[workspace]
resolver = "3"
members = ["vendor/openrust/passport", "vendor/openrust/framework", "vendor/openrust/modules", "vendor/openrust/translation-database", "tools/cli", "tools/macros", "tools/testing", "tools/performance"]
# 第三方 vendored crate 只作依赖，不作为第一方 workspace 包调度。
exclude = ["vendor/seaql/sea-orm-migration", "vendor/launchbadge/sqlx-mysql", "vendor/seaql/sea-orm"]
default-members = ["."]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hongyukeji/openrust"
homepage = "https://github.com/hongyukeji/openrust"
authors = ["OpenRust Contributors"]
categories = ["web-programming", "web-programming::http-server"]
keywords = ["framework", "web", "axum", "batteries-included", "backend"]

[workspace.dependencies]
openrust = { package = "openrust-framework", path = "vendor/openrust/framework", version = "0.0.0", default-features = false }
openrust-modules = { path = "vendor/openrust/modules", version = "0.0.0" }
openrust-translation-database = { path = "vendor/openrust/translation-database", version = "0.0.0", default-features = false }
cli = { path = "tools/cli", version = "0.0.0" }
macros = { path = "tools/macros", version = "0.0.0" }
testing = { path = "tools/testing", version = "0.0.0" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "fs", "sync", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "~0.14.6", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tonic-prost = "~0.14.6"
tonic-prost-build = "~0.14.6"
tonic-health = "~0.14.6"
tonic-reflection = { version = "~0.14.6", default-features = false, features = ["server"] }
prost = "0.14"
protoc-bin-vendored = "~3.3.0"
rcgen = "0.14.10"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-core = "0.5"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "catch-panic", "util", "cors", "compression-gzip", "compression-br", "fs"] }
cookie = { version = "0.18.2", features = ["percent-encode"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
argon2 = "0.6"
bcrypt = "=0.19.3"
shutdown_hooks = "=0.1.0"
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["non-fips", "alloc"] }
aes-gcm-siv = { version = "0.12.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
http = "1.5"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
ipnet = "2.11"
bytes = "1.11"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "raw_value"] }
glob = "0.3.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"
validator = { version = "0.21", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-json", "with-rust_decimal", "with-uuid", "with-time", "stream", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "=2.0.4", path = "vendor/seaql/sea-orm-migration", default-features = false, features = ["runtime-tokio-rustls"] }
sha2 = "0.10"
sha2_11 = { package = "sha2", version = "0.11" }
hmac = "0.13"
sha1 = "0.11"
md5_11 = { package = "md-5", version = "0.11" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
icu_datetime = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
chrono-tz = "0.10.4"
cron-parser = "0.12"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
zeroize = "1.9.1"
async-trait = "0.1"
redis = { version = "1.8.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
url = "2.5"
pcre2 = "=0.2.11"
sqlx = { version = "=0.9.0", default-features = false }
rusqlite = { version = "=0.39.0", default-features = false }
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25.17"
insta = "1.49"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
minijinja = { version = "~2.24.0", default-features = false, features = ["builtins", "fuel", "multi_template", "serde", "unicode"] }
oauth2 = { version = "5.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "multipart", "stream"] }
opendal = { version = "0.59.2", default-features = false, features = ["services-fs"] }
tempfile = "3.27"
csv = "1.4"
calamine = { version = "0.38", default-features = false, features = ["chrono"] }
rust_xlsxwriter = { version = "0.101", default-features = false, features = ["constant_memory"] }
zip = { version = "9", default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["encoding"] }
metrics = "0.24.5"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
# 错误语义由 openrust::Error 统一文档化，不要求每个函数重复写 `# Errors` 章节。
missing_errors_doc = "allow"
# crate 名已表达能力域，类型名允许重复该前缀（如 `QueueConfig`）。
module_name_repetitions = "allow"
must_use_candidate = "allow"

