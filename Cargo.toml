[features]
translation-database = ["dep:openrust-translation-database"]
default = ["db-mysql", "cache-redis", "queue-redis"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "dep:rustix", "dep:shutdown_hooks", "openrust/db-postgres", "openrust-translation-database?/db-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "dep:sqlx", "sqlx/mysql", "dep:rustix", "dep:shutdown_hooks", "openrust/db-mysql", "openrust-translation-database?/db-mysql"]
db-sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "dep:sqlx", "sqlx/sqlite", "dep:rusqlite", "dep:rustix", "dep:winapi-util", "dep:shutdown_hooks", "openrust/db-sqlite", "openrust-translation-database?/db-sqlite"]
db-uuid = ["dep:uuid", "sea-orm/with-uuid", "sea-orm-migration/with-uuid", "openrust/db-uuid"]
session = ["dep:time", "dep:base64", "openrust/session"]
auth = ["hashing", "session", "dep:base64", "dep:jsonwebtoken", "dep:time", "signing", "openrust/auth"]
hashing = ["dep:argon2", "dep:bcrypt", "openrust/hashing"]
queue = ["dep:cron-parser", "openrust/queue"]
queue-redis = ["queue", "dep:redis", "openrust/queue-redis"]
signing = ["dep:base64", "dep:jsonwebtoken", "openrust/signing"]
mail-smtp = ["lettre/smtp-transport", "lettre/tokio1-rustls-tls", "openrust/mail-smtp"]
mail-templates = ["dep:minijinja", "openrust/mail-templates"]
view = ["dep:minijinja", "minijinja/loader", "openrust/view"]
http-client = ["dep:reqwest", "dep:ipnet", "dep:httpdate", "openrust/http-client"]
auth-oidc = ["auth", "http-client", "encryption", "dep:oauth2", "openrust/auth-oidc"]
auth-fortify = ["auth", "encryption", "dep:sha1", "dep:md5_11", "dep:qrcode", "openrust/auth-fortify"]
sms-twilio = ["http-client", "dep:base64", "openrust/sms-twilio"]
encryption = ["dep:aes-gcm-siv", "dep:base64", "dep:zeroize", "openrust/encryption"]
test-util = ["openrust/test-util"]
data-exchange = ["dep:csv", "dep:calamine", "dep:rust_xlsxwriter", "dep:zip", "dep:quick-xml", "openrust/data-exchange"]
data-exchange-tasks = ["data-exchange", "queue", "dep:uuid", "openrust/data-exchange-tasks"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream", "dep:tonic-health", "dep:tonic-reflection", "dep:rustls", "openrust/grpc"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "openrust/metrics"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "openrust/otel"]
realtime = ["auth", "axum/ws", "dep:uuid", "openrust/realtime"]
realtime-redis = ["realtime", "dep:redis", "openrust/realtime-redis"]
cache-redis = ["dep:redis", "openrust/cache-redis"]
session-redis = ["session", "dep:redis", "openrust/session-redis"]
storage-local = ["dep:opendal", "dep:uuid", "dep:rustix", "openrust/storage-local"]
storage-s3 = ["dep:aws-sdk-s3", "storage-local", "opendal/services-s3", "opendal/http-transport-reqwest", "opendal/executors-tokio", "openrust/storage-s3"]

[lints]
workspace = true

[[bin]]
name = "app"
path = "src/main.rs"

[[test]]
name = "auth_oidc"
path = "tests/server/auth/oidc.rs"
required-features = ["auth-oidc"]

[[test]]
name = "auth_oidc_keycloak"
path = "tests/server/auth/oidc_keycloak.rs"
required-features = ["auth-oidc"]

[[test]]
name = "server"
path = "tests/server/server/aggregate.rs"

[[test]]
name = "example_auth_flows"
path = "modules/example/tests/auth_flows.rs"
required-features = ["auth", "queue", "view", "encryption"]

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# 依赖以 O2 编译一次后缓存，显著缩短开发期增量构建。
opt-level = 2

[target.'cfg(windows)'.dependencies]
winapi-util = { version = "=0.1.11", optional = true }

[patch.crates-io]
sea-orm = { path = "vendor/seaql/sea-orm" }
sqlx-mysql = { path = "vendor/launchbadge/sqlx-mysql" }


[[test]]
name = "application_session_defaults"
path = "tests/application/session_defaults.rs"
