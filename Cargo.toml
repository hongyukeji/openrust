[package]
name = "openrust"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hongyukeji/openrust"
description = "OpenRust — Laravel 的 Rust 实现"
readme = "README.md"
publish = false

[workspace]
members = ["vendor/openrust/framework"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "main"
path = "main.rs"
doc = false

[features]
standalone = []

[dependencies]
clap = "4.6.1"
openrust = { package = "openrust-framework", path = "vendor/openrust/framework" }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["net"] }

[[test]]
name = "container_process"
path = "tests/container_process.rs"
harness = false
