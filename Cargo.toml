[package]
name = "application"
publish = false
description = "OpenRust 默认应用与框架集成验收。"
readme = "README.md"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
autotests = false

[workspace]
resolver = "3"
members = ["framework", "tools/cli", "tools/macros", "tools/testing", "tools/performance", "examples/example", "examples/example/database/migrations"]
default-members = ["."]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hongyukeji/openrust"
homepage = "https://github.com/hongyukeji/openrust"
authors = ["OpenRust Contributors"]
categories = ["web-programming", "web-programming::http-server"]
keywords = ["framework", "web", "axum", "batteries-included", "backend"]

[workspace.dependencies]
openrust = { path = "framework", version = "0.0.0", default-features = false }
cli = { path = "tools/cli", version = "0.0.0" }
macros = { path = "tools/macros", version = "0.0.0" }
testing = { path = "tools/testing", version = "0.0.0" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "~0.14.6", default-features = false, features = ["codegen", "router", "transport", "tls-ring"] }
tonic-prost = "~0.14.6"
tonic-prost-build = "~0.14.6"
tonic-health = "~0.14.6"
tonic-reflection = { version = "~0.14.6", default-features = false, features = ["server"] }
prost = "0.14"
protoc-bin-vendored = "~3.3.0"
rcgen = "0.14.10"
axum = { version = "0.8", features = ["macros"] }
axum-core = "0.5"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "catch-panic", "util", "cors", "compression-gzip", "compression-br", "fs"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
argon2 = "0.6"
aes-gcm-siv = { version = "0.12.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22"
getrandom = "0.3"
http = "1.5"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
ipnet = "2.11"
bytes = "1.11"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"
validator = { version = "0.21", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-chrono", "with-json", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls"] }
sha2 = "0.10"
hmac = "0.13"
sha1 = "0.11"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
icu_datetime = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
chrono-tz = "0.10.4"
cron-parser = "0.12"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
zeroize = "1.9.1"
async-trait = "0.1"
redis = { version = "1.8.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
url = "2.5"
sqlx = { version = "0.9", default-features = false }
toml = "1.1"
toml_edit = "0.25.17"
insta = "1.49"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
minijinja = { version = "~2.24.0", default-features = false, features = ["builtins", "fuel", "multi_template", "serde", "unicode"] }
oauth2 = { version = "5.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "multipart", "stream"] }
opendal = { version = "0.59.2", default-features = false, features = ["services-fs"] }
tempfile = "3.27"
csv = "1.4"
calamine = { version = "0.37", default-features = false, features = ["chrono"] }
rust_xlsxwriter = { version = "0.101", default-features = false, features = ["constant_memory"] }
zip = { version = "9", default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["encoding"] }
metrics = "0.24.5"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
# 错误语义由 openrust::Error 统一文档化，不要求每个函数重复写 `# Errors` 章节。
missing_errors_doc = "allow"
# crate 名已表达能力域，类型名允许重复该前缀（如 `QueueConfig`）。
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
openrust.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
serde_json.workspace = true
tower-sessions = { workspace = true, features = ["memory-store"] }
tokio-stream.workspace = true

axum.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true
validator.workspace = true
redis.workspace = true
reqwest.workspace = true
tempfile.workspace = true
rcgen.workspace = true
