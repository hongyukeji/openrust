[app]
name = "{{name}}"
# 签名 URL 使用 APP_KEY 原始字节；生产环境应设置不可预测的密钥。
# 未配置时 Laravel 基线以空密钥签发，普通 URL 同样可用。
# 旧密钥可由 APP_PREVIOUS_KEYS=old-one,old-two 或 previous_keys 数组提供，仅用于验签。
url = "http://localhost:3000"
timezone = "UTC"

[server]
host = "127.0.0.1"
port = 3000
public_dir = "public"
root_target = "view:index.html"
request_timeout_secs = 30
max_concurrent_requests = 1024
shutdown_timeout_secs = 10
metrics_endpoint_enabled = false
# 显式设置 trusted_proxy_ranges = [] 可关闭平台自动代理；省略则沿框架默认策略。

[server.compression]
enabled = true

[server.cors]
enabled = false

[api]
http_status = "semantic"

[view]
directory = "resources/views"
auto_reload = false

[i18n]
default_locale = "en"
fallback_locale = "en"

[mail]
driver = "log"

[sms]
driver = "log"

[cache]
default = "redis"

[cache.stores.redis]
driver = "redis"
namespace = "{{name}}"
dsn = "redis://127.0.0.1:6379/"

[cache.singleflight]
max_in_flight_keys = 128
max_waiters_per_key = 64
loader_timeout_secs = 30

[cache.swr]
max_in_flight_refreshes = 64

[session]
# Cookie名称缺省按最终app.name推导；Secure缺省由可信传输信息决定。
driver = "database"
path = "/"
http_only = true
same_site = "lax"
lifetime = 120
lottery = [2, 100]
expire_on_close = false
partitioned = false
max_bytes = 20971520
serializer = "native"

[database]
table_prefix = "tb_"

# 可选的独立数据库实例不会继承默认数据库配置：
# [database.instances.analytics]
# url = "postgres://user:password@host/database"
# max_connections = 4
# table_prefix = "analytics_"
