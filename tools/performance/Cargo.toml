[package]
name = "performance"
description = "OpenRust framework performance benchmarks"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
autotests = false

[dependencies]
figment.workspace = true
openrust = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
db-routing-bench = []
db-postgres = ["openrust/db-postgres"]
db-mysql = ["openrust/db-mysql"]

[[bench]]
name = "db_routing"
harness = false
required-features = ["db-routing-bench"]

[lints]
workspace = true
