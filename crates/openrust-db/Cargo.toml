[package]
name = "openrust-db"
description = "Database layer of the OpenRust framework: connection pool, migrations, seeding, transactions and the PostgreSQL/MySQL dialect boundary"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
openrust-core.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
sqlx = { workspace = true, optional = true }

[features]
default = []
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "dep:sqlx", "sqlx/mysql"]

[dev-dependencies]
figment.workspace = true
tokio.workspace = true

[lints]
workspace = true
