[package]
name = "openrust-test"
description = "Testing toolkit for OpenRust applications: TestApp, HTTP test client, database isolation, factories and fake-driver assertions"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
openrust-core.workspace = true
openrust-db = { workspace = true, optional = true }
sea-orm.workspace = true
sqlx = { workspace = true, optional = true }
url.workspace = true
tokio.workspace = true

[features]
default = []
db-postgres = ["dep:openrust-db", "openrust-db/db-postgres"]
db-mysql = ["dep:openrust-db", "openrust-db/db-mysql", "dep:sqlx", "sqlx/mysql"]

[dev-dependencies]
sea-orm-migration.workspace = true

[lints]
workspace = true
