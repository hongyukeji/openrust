[package]
name = "openrust"
description = "OpenRust: an opinionated, batteries-included Rust application framework. Create a project, run one command, start writing business code."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
openrust-core.workspace = true
openrust-http.workspace = true
openrust-macros.workspace = true
openrust-mail.workspace = true
openrust-db = { workspace = true, optional = true }
tokio.workspace = true
tower.workspace = true
tracing.workspace = true

[lints]
workspace = true

[features]
default = []
db-postgres = ["dep:openrust-db", "openrust-db/db-postgres"]
db-mysql = ["dep:openrust-db", "openrust-db/db-mysql"]
mail-smtp = ["openrust-mail/mail-smtp"]
test-util = ["openrust-mail/test-util"]
